[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-gpt-researcher"
version = "0.1.0"
description = "A learning-focused reimplementation of the core GPT Researcher workflow"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "markdown-it-py>=4,<5",
    "openai>=2,<3",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "streamlit>=1.40,<2",
    "tavily-python>=0.7,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2,<3",
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]
